<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>At Your Service — Whatever you need. Whenever you need it.</title>
<meta name="description" content="Find trusted handymen, maids, chefs, barbers and service pros nearby, or post a job and let them come to you." />
<meta name="theme-color" content="#101014" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="At Your Service" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="toast-root" class="toast-root"></div>

<header class="topbar" id="topbar" hidden>
  <div class="topbar-inner">
    <a href="#/map" class="brand">🛎️ At Your Service</a>
    <nav class="topnav" id="topnav"></nav>
    <button class="icon-btn" id="menuToggle" aria-label="Menu">☰</button>
  </div>
  <nav class="topnav-mobile" id="topnavMobile" hidden></nav>
</header>

<div id="suspendedBanner" class="suspended-banner" hidden></div>

<main id="app" class="app"></main>

<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
